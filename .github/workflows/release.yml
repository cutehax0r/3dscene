name: release

# `make release v1.2.3` or `make release v1.2.3 abc123de`
# runs `make build`, creates zip from dist/ and publishes it on github
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build
        run: make build

      - name: Zip dist/
        run: |
          name="${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}"
          (cd dist && zip -qr "../${name}.zip" .)
          echo "ZIP=${name}.zip" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
